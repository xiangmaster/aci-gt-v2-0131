name: GT-0131 controlled summary consumer
on:
  workflow_run:
    workflows:
    - GT-0131 controlled summary producer
    types:
    - completed
jobs:
  comment:
    name: Post summary as comment for trusted authors only
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && 
      github.event.workflow_run.head_repository.full_name == github.repository 
      && github.event.workflow_run.event == 'issues' }}
    permissions:
      issues: write
      actions: read
    steps:
    - name: Download matching-run entry context
      uses: actions/download-artifact@v4
      with:
        name: gt-entry-context
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: Decode entry context
      id: entry
      run: "python3 - <<'PY'\nimport json,os\nx=json.load(open('gt-entry.json'))\n\
        n=x['issue_number']; a=x['author_association']\nassert isinstance(n,int) and
        n>0\nassert a in ['OWNER','MEMBER','COLLABORATOR','CONTRIBUTOR','FIRST_TIMER','FIRST_TIME_CONTRIBUTOR','NONE','MANNEQUIN']\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'issue_number={n}\\\
        nauthor_association={a}\\n')\nPY"
    - name: Download summary artifact
      uses: actions/download-artifact@v4
      with:
        name: issue-summary-${{ steps.entry.outputs.issue_number }}
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
    - name: Read summary
      id: read_summary
      run: "summary_file=$(ls | grep issue-summary-${{ steps.entry.outputs.issue_number
        }} || true)\n# artifact is a text file created by the previous job\nSUMMARY=$(cat
        \"$summary_file\" 2>/dev/null || true)\necho \"summary<<EOF\" >> $GITHUB_OUTPUT\n\
        echo \"$SUMMARY\" >> $GITHUB_OUTPUT\necho \"EOF\" >> $GITHUB_OUTPUT\n"
    - name: Comment with deterministic template
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE_NUMBER: ${{ steps.entry.outputs.issue_number }}
        SUMMARY: ${{ steps.read_summary.outputs.summary }}
      run: "# Publish a deterministic, reviewer-facing template rather than raw model
        output to reduce abuse surface.\ncat <<'MSG' > /tmp/comment.md\n**Automated
        issue summary (maintainers only)**\n\nThe following summary was generated
        automatically for maintainers to review. It may have been influenced by the
        issue content and should be verified before relying on it.\n\n---\n\n$SUMMARY\n\
        \n---\n\n*This comment was generated by an automated workflow and is posted
        only for trusted contributors.*\nMSG\n\ngh issue comment \"$ISSUE_NUMBER\"\
        \ --body \"$(cat /tmp/comment.md)\"\n"
      if: ${{ contains('OWNER,MEMBER,CONTRIBUTOR,COLLABORATOR', 
        steps.entry.outputs.author_association) }}
    environment: gt-review
